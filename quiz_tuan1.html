<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧪 Quiz — Kiểm Tra Báo Cáo Tuần 1</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-card: #12121a;
      --bg-card-hover: #1a1a28;
      --bg-option: #1a1a28;
      --bg-option-hover: #22223a;
      --text-primary: #e8e8f0;
      --text-secondary: #8888a8;
      --text-dim: #55556a;
      --accent-blue: #6366f1;
      --accent-purple: #a855f7;
      --accent-pink: #ec4899;
      --accent-cyan: #22d3ee;
      --correct: #22c55e;
      --correct-bg: rgba(34, 197, 94, 0.12);
      --correct-border: rgba(34, 197, 94, 0.4);
      --wrong: #ef4444;
      --wrong-bg: rgba(239, 68, 68, 0.1);
      --wrong-border: rgba(239, 68, 68, 0.35);
      --border: rgba(255, 255, 255, 0.06);
      --glass: rgba(255, 255, 255, 0.03);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Animated BG ── */
    .bg-glow {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .bg-glow .orb {
      position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.18;
      animation: orbFloat 20s ease-in-out infinite alternate;
    }
    .bg-glow .orb:nth-child(1) { width: 600px; height: 600px; background: var(--accent-blue); top: -10%; left: -10%; }
    .bg-glow .orb:nth-child(2) { width: 500px; height: 500px; background: var(--accent-purple); bottom: -15%; right: -5%; animation-delay: -7s; }
    .bg-glow .orb:nth-child(3) { width: 400px; height: 400px; background: var(--accent-pink); top: 40%; left: 50%; animation-delay: -14s; }
    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, -40px) scale(1.15); }
      100% { transform: translate(-30px, 50px) scale(0.95); }
    }

    /* ── Layout ── */
    .app { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }

    /* ── Start Screen ── */
    .start-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 85vh; text-align: center; animation: fadeUp 0.8s ease;
    }
    .start-screen .icon { font-size: 72px; margin-bottom: 24px; animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
    .start-screen h1 {
      font-size: 2.4rem; font-weight: 900;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 12px; line-height: 1.2;
    }
    .start-screen .subtitle { color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 14px; max-width: 480px; line-height: 1.6; }
    .start-screen .meta-info {
      display: flex; gap: 24px; margin-bottom: 36px; color: var(--text-dim); font-size: 0.85rem;
    }
    .start-screen .meta-info span { display: flex; align-items: center; gap: 6px; }
    .btn-start {
      padding: 16px 52px; font-size: 1.1rem; font-weight: 700; font-family: 'Inter', sans-serif;
      border: none; border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #fff; transition: all 0.3s ease; position: relative; overflow: hidden;
    }
    .btn-start:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(99, 102, 241, 0.35); }
    .btn-start:active { transform: translateY(0); }

    /* ── Progress Bar ── */
    .progress-wrapper {
      position: sticky; top: 0; z-index: 10; padding: 20px 0 16px;
      background: linear-gradient(180deg, var(--bg-primary) 60%, transparent);
    }
    .progress-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .progress-label { font-size: 0.82rem; color: var(--text-secondary); font-weight: 500; }
    .progress-counter { font-size: 0.82rem; color: var(--text-dim); font-weight: 600; }
    .progress-track {
      height: 6px; background: var(--border); border-radius: 99px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; border-radius: 99px; transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
    }

    /* ── Section Badge ── */
    .section-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 16px; border-radius: 99px; font-size: 0.78rem; font-weight: 600;
      background: var(--glass); border: 1px solid var(--border);
      color: var(--accent-cyan); margin-bottom: 20px; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .section-badge .stars { color: #fbbf24; letter-spacing: 1px; }

    /* ── Question Card ── */
    .question-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px; padding: 36px 32px 32px; margin-bottom: 20px;
      animation: fadeUp 0.5s ease; position: relative; overflow: hidden;
    }
    .question-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
      opacity: 0.6;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-number {
      font-size: 0.78rem; color: var(--text-dim); font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 14px;
    }
    .question-text {
      font-size: 1.12rem; font-weight: 600; line-height: 1.7; margin-bottom: 8px;
      color: var(--text-primary);
    }
    .question-code {
      background: #0d0d14; border: 1px solid var(--border); border-radius: 12px;
      padding: 16px 20px; margin: 16px 0 24px; font-family: 'Cascadia Code', 'Fira Code', monospace;
      font-size: 0.88rem; line-height: 1.7; color: #c4b5fd; overflow-x: auto;
      white-space: pre;
    }

    /* ── Options ── */
    .options { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .option-btn {
      display: flex; align-items: flex-start; gap: 14px; padding: 16px 20px;
      background: var(--bg-option); border: 1.5px solid var(--border); border-radius: 14px;
      cursor: pointer; transition: all 0.25s ease; text-align: left; width: 100%;
      font-family: 'Inter', sans-serif; color: var(--text-primary); font-size: 0.95rem;
      line-height: 1.55;
    }
    .option-btn:hover:not(.disabled) {
      background: var(--bg-option-hover); border-color: rgba(99, 102, 241, 0.3);
      transform: translateX(4px);
    }
    .option-btn .option-label {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.82rem;
      background: rgba(99, 102, 241, 0.1); color: var(--accent-blue);
      transition: all 0.25s ease;
    }
    .option-btn:hover:not(.disabled) .option-label {
      background: rgba(99, 102, 241, 0.2);
    }
    .option-btn .option-text { padding-top: 4px; flex: 1; }

    /* correct / wrong states */
    .option-btn.correct {
      background: var(--correct-bg); border-color: var(--correct-border);
      cursor: default;
    }
    .option-btn.correct .option-label {
      background: var(--correct); color: #fff;
    }
    .option-btn.wrong {
      background: var(--wrong-bg); border-color: var(--wrong-border);
      cursor: default;
    }
    .option-btn.wrong .option-label {
      background: var(--wrong); color: #fff;
    }
    .option-btn.disabled { cursor: default; opacity: 0.45; }
    .option-btn.disabled:hover { transform: none; background: var(--bg-option); border-color: var(--border); }

    /* ── Feedback Toast ── */
    .feedback {
      margin-top: 16px; padding: 14px 20px; border-radius: 12px;
      font-size: 0.9rem; font-weight: 500; line-height: 1.5;
      animation: fadeUp 0.35s ease;
    }
    .feedback.correct { background: var(--correct-bg); border: 1px solid var(--correct-border); color: #86efac; }
    .feedback.wrong { background: var(--wrong-bg); border: 1px solid var(--wrong-border); color: #fca5a5; }

    /* ── Next Button ── */
    .btn-next {
      display: block; margin: 10px 0 0 auto; padding: 12px 32px;
      font-size: 0.95rem; font-weight: 600; font-family: 'Inter', sans-serif;
      border: none; border-radius: 12px; cursor: pointer;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #fff; transition: all 0.3s ease; animation: fadeUp 0.4s ease;
    }
    .btn-next:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3); }

    /* ── Result Screen ── */
    .result-screen { text-align: center; animation: fadeUp 0.8s ease; padding: 60px 20px; }
    .result-screen .score-ring {
      width: 200px; height: 200px; margin: 0 auto 32px; position: relative;
    }
    .result-screen .score-ring svg { transform: rotate(-90deg); }
    .result-screen .score-ring .ring-bg { fill: none; stroke: var(--border); stroke-width: 8; }
    .result-screen .score-ring .ring-fill {
      fill: none; stroke-width: 8; stroke-linecap: round;
      transition: stroke-dashoffset 1.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .result-screen .score-text {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .result-screen .score-number { font-size: 3.2rem; font-weight: 900; line-height: 1; }
    .result-screen .score-total { font-size: 0.9rem; color: var(--text-dim); margin-top: 4px; }
    .result-screen h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; }
    .result-screen .result-msg {
      color: var(--text-secondary); font-size: 1.05rem; line-height: 1.7;
      max-width: 520px; margin: 0 auto 32px;
    }

    /* Breakdown */
    .breakdown {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
      padding: 28px 24px; text-align: left; max-width: 560px; margin: 0 auto 28px;
    }
    .breakdown h3 { font-size: 1rem; font-weight: 700; margin-bottom: 16px; color: var(--text-secondary); }
    .breakdown-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .breakdown-row:last-child { border-bottom: none; }
    .breakdown-row .topic { font-size: 0.88rem; font-weight: 500; }
    .breakdown-row .score-badge {
      padding: 4px 12px; border-radius: 99px; font-size: 0.8rem; font-weight: 700;
    }
    .breakdown-row .score-badge.good { background: var(--correct-bg); color: var(--correct); }
    .breakdown-row .score-badge.mid { background: rgba(250, 204, 21, 0.12); color: #fbbf24; }
    .breakdown-row .score-badge.bad { background: var(--wrong-bg); color: var(--wrong); }

    .btn-restart {
      padding: 14px 44px; font-size: 1rem; font-weight: 700; font-family: 'Inter', sans-serif;
      border: 2px solid var(--border); border-radius: 14px; cursor: pointer;
      background: transparent; color: var(--text-primary); transition: all 0.3s ease;
    }
    .btn-restart:hover { border-color: var(--accent-blue); background: rgba(99, 102, 241, 0.08); }

    /* ── Hide helpers ── */
    .hidden { display: none !important; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .start-screen h1 { font-size: 1.7rem; }
      .question-card { padding: 24px 18px 22px; }
      .option-btn { padding: 14px 14px; font-size: 0.88rem; }
      .app { padding: 24px 12px 60px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="app" id="app">
    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
      <div class="icon">🧪</div>
      <h1>Kiểm Tra Báo Cáo Tuần 1</h1>
      <p class="subtitle">25 câu hỏi trắc nghiệm được thiết kế theo chính xác những gì bạn tự nhận trong báo cáo. Độ khó tỷ lệ thuận với mức tự đánh giá của bạn.</p>
      <div class="meta-info">
        <span>📝 25 câu hỏi</span>
        <span>⏱ ~10 phút</span>
        <span>🎯 8 chủ đề</span>
      </div>
      <button class="btn-start" onclick="startQuiz()">Bắt Đầu Kiểm Tra</button>
    </div>

    <!-- Quiz Screen -->
    <div class="hidden" id="quizScreen">
      <div class="progress-wrapper">
        <div class="progress-header">
          <span class="progress-label" id="progressLabel">Đang tiến hành...</span>
          <span class="progress-counter" id="progressCounter">1 / 25</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
      </div>
      <div id="questionArea"></div>
    </div>

    <!-- Result Screen -->
    <div class="hidden" id="resultScreen"></div>
  </div>

  <script>
    // ── Quiz Data ──
    const questions = [
      {
        section: "Git & GitHub", stars: "★★★★☆",
        question: "Bạn viết rằng đã nắm vững quy trình merge branch. Vậy khi thực hiện <code>git merge feature</code> vào <code>main</code> và xảy ra merge conflict, Git sẽ làm gì?",
        options: [
          "Tự động chọn phiên bản mới nhất và hoàn tất merge",
          "Hủy merge hoàn toàn và quay về trạng thái trước đó",
          "Đánh dấu conflict trong file, dừng merge và chờ người dùng resolve thủ công",
          "Tạo một branch mới chứa cả hai phiên bản"
        ],
        correct: 2,
        explain: "Git đánh dấu vùng conflict bằng <<<<<<< / ======= / >>>>>>> và dừng lại để bạn resolve thủ công."
      },
      {
        section: "Git & GitHub", stars: "★★★★☆",
        question: "Bạn nói đã thành thạo push/pull. Sự khác biệt chính giữa <code>git fetch</code> và <code>git pull</code> là gì?",
        options: [
          "fetch chỉ tải metadata, pull tải cả code",
          "fetch tải thay đổi về local repo nhưng không merge, pull = fetch + merge",
          "fetch dùng cho branch hiện tại, pull dùng cho tất cả branch",
          "Không có sự khác biệt, chỉ là alias của nhau"
        ],
        correct: 1,
        explain: "git pull = git fetch + git merge. Fetch chỉ cập nhật remote tracking branches mà không merge vào working branch."
      },
      {
        section: "Git & GitHub", stars: "★★★★☆",
        question: "Bạn nhắc đến quản lý branch. Lệnh nào tạo branch mới <strong>và đồng thời chuyển sang</strong> branch đó?",
        options: [
          "<code>git branch new-branch && git checkout new-branch</code>",
          "<code>git checkout -b new-branch</code>",
          "<code>git switch -c new-branch</code>",
          "Cả B và C đều đúng"
        ],
        correct: 3,
        explain: "Cả git checkout -b và git switch -c đều tạo + chuyển sang branch mới. git switch là lệnh mới thay thế checkout."
      },
      {
        section: "Python Cơ Bản", stars: "★★★☆☆",
        question: "Bạn nói đã hiểu các kiểu dữ liệu cơ bản. Output của đoạn code sau là gì?",
        code: 'x = 10 / 3\nprint(type(x).__name__)',
        options: ["int", "float", "double", "decimal"],
        correct: 1,
        explain: "Toán tử / trong Python 3 luôn trả về float, kể cả khi chia hết. Dùng // để chia lấy phần nguyên."
      },
      {
        section: "Python Cơ Bản", stars: "★★★☆☆",
        question: "Về xử lý chuỗi — Output của đoạn code sau?",
        code: 's = "Hello, World!"\nprint(s[7:12])',
        options: ["World", "World!", ", Wor", "orld!"],
        correct: 0,
        explain: 's[7:12] lấy từ index 7 đến 11 (không bao gồm 12): "W", "o", "r", "l", "d" → "World".'
      },
      {
        section: "Python Cơ Bản", stars: "★★★☆☆",
        question: "Về toán tử — Output của biểu thức sau?",
        code: 'print(2 ** 3 ** 2)',
        options: [
          "64 — tức (2³)² = 8² = 64",
          "512 — tức 2^(3²) = 2⁹ = 512",
          "81",
          "Error"
        ],
        correct: 1,
        explain: "Toán tử ** có tính chất right-associative, nên 2 ** 3 ** 2 = 2 ** (3 ** 2) = 2⁹ = 512."
      },
      {
        section: "Cấu Trúc Dữ Liệu", stars: "★★★★☆",
        question: "Bạn viết mình phân biệt rõ ràng các cấu trúc dữ liệu. Cái nào sau đây <strong>KHÔNG thể</strong> làm key trong Dictionary?",
        options: [
          "(1, 2, 3) — Tuple",
          '"hello" — String',
          "[1, 2, 3] — List",
          "42 — Integer"
        ],
        correct: 2,
        explain: "Key trong Dictionary phải là hashable. List là mutable nên không hashable → không thể làm key."
      },
      {
        section: "Cấu Trúc Dữ Liệu", stars: "★★★★☆",
        question: 'Bạn nói "hiểu được khi nào nên dùng Set để tối ưu tìm kiếm". Tại sao lookup trong Set nhanh hơn List?',
        options: [
          "Set được sắp xếp tự động nên dùng Binary Search",
          "Set sử dụng hash table, lookup trung bình là O(1) thay vì O(n) của List",
          "Set lưu trữ ít dữ liệu hơn nên nhanh hơn",
          "Python compiler tối ưu hóa Set ở mức bytecode"
        ],
        correct: 1,
        explain: "Set dùng hash table nên lookup/membership test trung bình O(1), trong khi List phải duyệt tuần tự O(n)."
      },
      {
        section: "Cấu Trúc Dữ Liệu", stars: "★★★★☆",
        question: "Bạn nhắc đến Tuple cho dữ liệu bất biến. Output của đoạn code sau?",
        code: 't = (1, [2, 3], 4)\nt[1].append(5)\nprint(t)',
        options: [
          "(1, [2, 3], 4) — Tuple bất biến nên không thay đổi",
          "TypeError — Không thể thay đổi phần tử trong Tuple",
          "(1, [2, 3, 5], 4) — List bên trong vẫn mutable",
          "(1, [2, 3], 4, 5)"
        ],
        correct: 2,
        explain: "Tuple là bất biến về references, nhưng nếu phần tử bên trong là mutable (như List), bản thân phần tử đó vẫn thay đổi được."
      },
      {
        section: "Control Flow & Functions", stars: "★★★★☆",
        question: 'Bạn tự nhận "thoải mái" với <code>*args</code> và <code>**kwargs</code>. Output của đoạn code sau?',
        code: 'def func(a, *args, **kwargs):\n    print(a, len(args), len(kwargs))\n\nfunc(1, 2, 3, x=4, y=5)',
        options: [
          "1 2 2",
          "1 3 2",
          "1 2 3",
          "Error — không thể trộn *args và **kwargs"
        ],
        correct: 0,
        explain: "a=1, args=(2, 3) → len = 2, kwargs={'x':4, 'y':5} → len = 2. Kết quả: 1 2 2."
      },
      {
        section: "Control Flow & Functions", stars: "★★★★☆",
        question: "Bạn nói thành thạo lambda và list comprehension. Đoạn code sau cho output gì?",
        code: 'result = list(map(lambda x: x**2, filter(lambda x: x % 2 == 0, range(1, 8))))\nprint(result)',
        options: [
          "[1, 4, 9, 16, 25, 36, 49]",
          "[4, 16, 36]",
          "[1, 9, 25, 49]",
          "[2, 4, 6]"
        ],
        correct: 1,
        explain: "filter lọc số chẵn từ 1-7: [2, 4, 6]. map bình phương: [4, 16, 36]."
      },
      {
        section: "Control Flow & Functions", stars: "★★★★☆",
        question: "Viết lại câu trên bằng list comprehension tương đương — đáp án nào đúng?",
        options: [
          "[x**2 for x in range(1,8) if x % 2 == 0]",
          "[x**2 if x % 2 == 0 for x in range(1,8)]",
          "[x for x in range(1,8) if x**2 % 2 == 0]",
          "[x**2 for x in range(1,8) if x**2 % 2 == 0]"
        ],
        correct: 0,
        explain: "Cú pháp: [expression for item in iterable if condition]. Filter đặt ở cuối, sau for."
      },
      {
        section: "OOP ⭐", stars: "★★★★★",
        question: "Bạn nói hiểu sâu kế thừa (inheritance). Với diamond inheritance dưới đây, <code>D().greet()</code> in ra gì?",
        code: 'class A:\n    def greet(self): return "A"\n\nclass B(A):\n    def greet(self): return "B"\n\nclass C(A):\n    def greet(self): return "C"\n\nclass D(B, C):\n    pass\n\nprint(D().greet())',
        options: [
          '"A" — Vì A là class gốc',

      {

        question: "Bạn nói nắm try/except/finally. Đoạn code sau in ra gì?",

        correct: 1,

        question: "Sự khác biệt giữa mode <code>'w'</code> và <code>'a'</code> khi mở file là gì?",

        ],

        ],
        correct: 1,
        explain: "NumPy arrays là contiguous C arrays. Vectorized ops chạy trên C level, tránh Python object overhead và type checking per element."
      },
      {
        section: "Tổng Hợp", stars: "📌",
        question: "Bạn viết rằng đã thực hành OOP qua file <code>OOP_Practice.ipynb</code>. Trong file đó bạn đã xây dựng class về chủ đề gì?",
        options: [
          "Hệ thống quản lý thư viện sách",
          "Hệ thống quản lý sinh viên",
          "Hệ thống quản lý động vật / Animal hierarchy",
          "Tôi nhớ rõ và sẽ mô tả riêng"
        ],
        correct: -1, // no auto-correct, manual verification
        explain: "Đây là câu xác minh — chỉ bạn mới biết đáp án. Hãy chọn đáp án đúng hoặc tự mô tả."
      },
      {
        section: "Tổng Hợp", stars: "📌",
        question: "Trong báo cáo, bạn tự đánh giá RegEx và Exception Handling đều ★★☆☆☆. Lý do cụ thể bạn đưa ra cho mỗi phần lần lượt là gì?",
        options: [
          'RegEx: "chưa tự viết được pattern phức tạp" — Exception: "chưa thực hành nhiều"',
          'RegEx: "chưa học" — Exception: "quá khó"',
          'RegEx: "không cần thiết" — Exception: "đã nắm vững"',
          'RegEx: "chưa thực hành" — Exception: "chưa tìm hiểu"'
        ],
        correct: 0,
        explain: 'Đúng theo báo cáo: RegEx — "có thể đọc hiểu... nhưng chưa tự viết được pattern phức tạp". Exception — "nắm lý thuyết... chưa thực hành nhiều".'
      }

    // ── Section grouping for results ──
    const sectionMeta = {
      "Git & GitHub": { color: "#f97316", icon: "🔀" },
      "Python Cơ Bản": { color: "#3b82f6", icon: "🐍" },
      "Cấu Trúc Dữ Liệu": { color: "#8b5cf6", icon: "📦" },
      "Control Flow & Functions": { color: "#06b6d4", icon: "🔄" },
      "OOP ⭐": { color: "#ec4899", icon: "🏗️" },
      "RegEx": { color: "#22c55e", icon: "🔍" },
      "Exception & File Handling": { color: "#eab308", icon: "⚠️" },
      "NumPy 1": { color: "#6366f1", icon: "🔢" },
      "Tổng Hợp": { color: "#a855f7", icon: "📌" }
    };

    // ── State ──
    let currentQ = 0;
    let score = 0;
    let answers = [];
    let sectionScores = {};

    function startQuiz() {
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('quizScreen').classList.remove('hidden');
      showQuestion();
    }

    function showQuestion() {
      const q = questions[currentQ];
      const area = document.getElementById('questionArea');
      const labels = ['A', 'B', 'C', 'D'];

      // Update progress
      document.getElementById('progressCounter').textContent = `${currentQ + 1} / ${questions.length}`;
      document.getElementById('progressFill').style.width = `${((currentQ) / questions.length) * 100}%`;
      document.getElementById('progressLabel').textContent = q.section;

      let codeBlock = '';
      if (q.code) {
        codeBlock = `<div class="question-code">${escapeHtml(q.code)}</div>`;
      }

      let optionsHtml = q.options.map((opt, i) => `
        <button class="option-btn" onclick="selectAnswer(${i})" data-idx="${i}">
          <span class="option-label">${labels[i]}</span>
          <span class="option-text">${opt}</span>
        </button>
      `).join('');

      area.innerHTML = `
        <div class="section-badge">
          ${sectionMeta[q.section]?.icon || '📝'} ${q.section}
          <span class="stars">${q.stars}</span>
        </div>
        <div class="question-card" id="qCard">
          <div class="question-number">Câu ${currentQ + 1} / ${questions.length}</div>
          <div class="question-text">${q.question}</div>
          ${codeBlock}
          <div class="options" id="optionsContainer">
            ${optionsHtml}
          </div>
          <div id="feedbackArea"></div>
          <div id="nextArea"></div>
        </div>
      `;

      // Scroll to top smoothly
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectAnswer(idx) {
      const q = questions[currentQ];
      const btns = document.querySelectorAll('.option-btn');
      const feedbackArea = document.getElementById('feedbackArea');
      const nextArea = document.getElementById('nextArea');

      // Disable all buttons
      btns.forEach(btn => {
        btn.classList.add('disabled');
        btn.onclick = null;
      });

      const isManual = q.correct === -1;
      let isCorrect = false;

      if (isManual) {
        // Manual verification question — mark as "noted"
        btns[idx].classList.add('correct');
        feedbackArea.innerHTML = `
          <div class="feedback correct">
            📌 Ghi nhận câu trả lời của bạn. ${q.explain}
          </div>
        `;
        isCorrect = true; // Give benefit of doubt
      } else if (idx === q.correct) {
        isCorrect = true;
        btns[idx].classList.add('correct');
        btns[idx].querySelector('.option-label').textContent = '✓';
        feedbackArea.innerHTML = `
          <div class="feedback correct">
            ✅ Chính xác! ${q.explain}
          </div>
        `;
      } else {
        btns[idx].classList.add('wrong');
        btns[idx].querySelector('.option-label').textContent = '✗';
        btns[q.correct].classList.add('correct');
        btns[q.correct].querySelector('.option-label').textContent = '✓';
        feedbackArea.innerHTML = `
          <div class="feedback wrong">
            ❌ Sai rồi! ${q.explain}
          </div>
        `;
      }

      if (isCorrect) score++;
      answers.push({ question: currentQ, selected: idx, correct: isCorrect });

      // Track section score
      if (!sectionScores[q.section]) sectionScores[q.section] = { correct: 0, total: 0 };
      sectionScores[q.section].total++;
      if (isCorrect) sectionScores[q.section].correct++;

      // Show next button
      const isLast = currentQ >= questions.length - 1;
      nextArea.innerHTML = `
        <button class="btn-next" onclick="${isLast ? 'showResults()' : 'nextQuestion()'}">
          ${isLast ? '📊 Xem Kết Quả' : 'Câu Tiếp Theo →'}
        </button>
      `;
    }

    function nextQuestion() {
      currentQ++;
      showQuestion();
    }

    function showResults() {
      document.getElementById('quizScreen').classList.add('hidden');
      const resultScreen = document.getElementById('resultScreen');
      resultScreen.classList.remove('hidden');

      const pct = Math.round((score / questions.length) * 100);
      const circumference = 2 * Math.PI * 88;
      const offset = circumference - (pct / 100) * circumference;

      let verdict, verdictColor, verdictEmoji;
      if (pct >= 90) { verdict = 'Báo cáo hoàn toàn chính xác'; verdictColor = 'var(--correct)'; verdictEmoji = '🏆'; }
      else if (pct >= 72) { verdict = 'Báo cáo phần lớn chính xác'; verdictColor = '#22d3ee'; verdictEmoji = '✅'; }
      else if (pct >= 52) { verdict = 'Báo cáo hơi phóng đại'; verdictColor = '#fbbf24'; verdictEmoji = '⚠️'; }
      else { verdict = 'Báo cáo chưa phản ánh đúng năng lực'; verdictColor = 'var(--wrong)'; verdictEmoji = '🔴'; }

      // Breakdown rows
      let breakdownHtml = '';
      for (const [section, data] of Object.entries(sectionScores)) {
        const ratio = data.correct / data.total;
        let badgeClass = 'good';
        if (ratio < 0.5) badgeClass = 'bad';
        else if (ratio < 0.8) badgeClass = 'mid';
        breakdownHtml += `
          <div class="breakdown-row">
            <span class="topic">${sectionMeta[section]?.icon || ''} ${section}</span>
            <span class="score-badge ${badgeClass}">${data.correct}/${data.total}</span>
          </div>
        `;
      }

      resultScreen.innerHTML = `
        <div class="result-screen">
          <div class="score-ring">
            <svg width="200" height="200" viewBox="0 0 200 200">
              <circle class="ring-bg" cx="100" cy="100" r="88"/>
              <circle class="ring-fill" cx="100" cy="100" r="88"
                stroke="${verdictColor}"
                stroke-dasharray="${circumference}"
                stroke-dashoffset="${circumference}"
                id="ringFill"/>
            </svg>
            <div class="score-text">
              <div class="score-number" style="color: ${verdictColor}">${score}</div>
              <div class="score-total">/ ${questions.length}</div>
            </div>
          </div>
          <h2>${verdictEmoji} ${verdict}</h2>
          <p class="result-msg">
            Bạn trả lời đúng <strong>${score}/${questions.length}</strong> câu (${pct}%).
            ${pct >= 90 ? 'Bạn thực sự nắm vững kiến thức đã báo cáo. Ấn tượng!' :
              pct >= 72 ? 'Phần lớn kiến thức đã được nắm, nhưng có vài chỗ cần ôn lại.' :
              pct >= 52 ? 'Một số phần trong báo cáo có vẻ được đánh giá cao hơn thực tế. Hãy thực hành thêm!' :
              'Kết quả cho thấy khoảng cách lớn giữa báo cáo và kiến thức thực tế. Cần học lại nghiêm túc.'}
          </p>
          <div class="breakdown">
            <h3>📊 Chi Tiết Theo Chủ Đề</h3>
            ${breakdownHtml}
          </div>
          <button class="btn-restart" onclick="restartQuiz()">🔄 Làm Lại</button>
        </div>
      `;

      // Animate ring
      requestAnimationFrame(() => {
        setTimeout(() => {
          document.getElementById('ringFill').style.strokeDashoffset = offset;
        }, 100);
      });
    }

    function restartQuiz() {
      currentQ = 0; score = 0; answers = []; sectionScores = {};
      document.getElementById('resultScreen').classList.add('hidden');
      document.getElementById('resultScreen').innerHTML = '';
      document.getElementById('startScreen').classList.remove('hidden');
    }

    function escapeHtml(text) {
      return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
